graph_planner:
  ros__parameters:
    rl_kappa: 9
    rl_s: 7

    # offline
    lat_resolution: 0.1 #0.1 
    variable_heading: true
    d_straight: 1.8 #1.8
    d_curve: 0.8 #0.8
    curve_thr: 0.02
    lat_offset: 3.0
    max_lat_steps: 8
    virt_goal_n: true
    min_vel_race: 1.0
    max_lateral_accel: 7.0
    # prune_kappa_max [rad/m]: pruneEdges 가 그래프에서 **영구 삭제**하는 spline 의 peak |kappa| 임계.
    #   2026-08-20 이전에는 NodeGraph.hpp 에 5.0 하드코딩이었고, 이게 정지의 주원인이었다.
    #   부팅 때 1회 도는 오프라인 단계라, 여기서 지운 엣지는 주행 중 다익스트라가 되살릴 수 없다.
    #   삭제가 하필 코너에 집중된다(휘는 엣지 = 코너 = 회피가 필요한 곳).
    #
    #   실측 A (obs_debug_0820_1348, hall_0820):
    #     5.0 -> 엣지 2656->2208(16.9% 삭제), 코너 layer 21/22 는 56->10, 56->8 로 거의 단절,
    #            자식 0개인 막다른 노드 11개. otwpnts 성공률 38.9%
    #     8.0 -> 3.9% 삭제. 성공률 53.3%
    #   실측 B (obs_debug_0820_1656, 70초 지점부터 60초):
    #     5.0  -> 성공률 12.0%, 발행 경로 peak|kappa| 중앙 2.18 / 최대 4.90, graph_search 실패 41회
    #     14.0 -> 성공률 62.2%, 발행 경로 peak|kappa| 중앙 2.83 / 최대 5.08, graph_search 실패  9회
    #   -> 필터를 꺼도 최종 경로 곡률은 사실상 그대로다(최대 4.90 -> 5.08). 곡률은 이미
    #      computeSplineCost 의 w_curv_avg/w_curv_peak 로 비용에 반영돼 있어서, 완만한 길이
    #      있으면 다익스트라가 알아서 그쪽으로 간다. 삭제는 선택지만 없앨 뿐이었다.
    #
    #   기본값 100.0 = 사실상 비활성. 예전 거동으로 돌리려면 5.0 으로 두고 노드를 재시작한다
    #   (오프라인 파라미터라 ros2 param set 으로는 안 바뀐다).
    prune_kappa_max: 100.0
    closure_detection_dist: 20.0

    initial_layer: 4
    vel_decrease_lat: 0.1
    evasion_length: 6.0

    stepsize_approx: 2.5
    no_interp_points: 50

    # 실측 차폭 (2026-07-31 측정). fsdp 의 width_car 와 반드시 같은 값이어야 한다.
    # 노드 개수/raceline 인덱스와 장애물 차단 여유가 전부 이 값에서 유도된다.
    veh_width: 0.28
    veh_length: 0.535
    veh_turn: 0.5
    vel_max: 11.0
    gg_scale: 0.2

    w_raceline: 1.0
    w_raceline_sat: 1.0
    w_length: 0.0
    w_curv_avg: 7000.0
    w_curv_peak: 2500.0
    w_virt_goal: 10000.0
    w_inner: 0.7
    w_outer: 1.2

    max_heading_offset: 0.7853981633974483
    map_name: "hall_1030"
    csv_output_path: "/home/misys/forza_ws/race_stack/stack_master/maps/"

    ax_max: 3.8
    ay_max: 5.4
    drag_coeff: 0.25
    m_veh: 6.0
    dyn_model_exp: 1.5
    mu: 1.0
    closed_track: false

    # ==== online (회피) 파라미터 =============================================
    # 2026-08-04 추가. 원래 이 값들은 graph_planner.cpp 의 declare_parameter
    # 기본값으로만 존재해서, yaml 을 읽어도 현재 값이 뭔지 알 수 없었다.
    # 아래는 전부 **cpp 기본값과 동일한 값**이라 적어 넣어도 거동은 그대로다.
    # 전부 dynamic param 이라 주행 중 ros2 param set /graph_planner ... 로도 바뀐다.
    #
    # 장애물 차단 여유 = veh_width/2 + safety_margin + inflate_idx * lat_resolution
    #                  =    0.14     +     0.15      +      0      *     0.1     = 0.29 m
    #
    # safety_margin [m]: 회피선이 장애물 표면에서 확보할 여유(저속 기준).
    safety_margin: 0.10
    # min_safety_margin [m]: 폭이 좁아 해가 없을 때 layer 단위로 여기까지 깎는 하한.
    #   ★ state_machine 의 lateral_width_ot_m(0.17) 이 여기 묶여 있다:
    #     veh_width/2 < lateral_width_ot_m < veh_width/2 + min_safety_margin
    #     (0.14 < 0.17 < 0.19). 이 값을 바꾸면 lateral_width_ot_m 도 같이 봐야 한다.
    min_safety_margin: 0.03
    #
    # block_obs_tail_layer [bool]: 장애물이 걸친 layer 바로 뒤 한 장("꼬리 layer")도 막을지.
    #   2026-08-20 이전 거동은 true 였다 (find_obs_jone 의 span+1).
    #   꼬리 layer 에는 장애물이 없는데 장애물의 frenet d 밴드가 그대로 복사된다. 코너에서는
    #   raceline 이 트랙 안에서 옆으로 이동하므로 그 밴드가 엉뚱한 쪽을 지우고, 앞뒤 layer 의
    #   자유 구간이 좌우로 갈라져 통로가 끊긴다 (obs_debug_0819: layer 30 자유=우, 31 자유=좌).
    #   장애물을 뚫는 edge 는 "진짜 layer" 의 차단 노드에서 나가는 edge 라 이미 막힌다.
    #   되돌리려면: ros2 param set /graph_planner block_obs_tail_layer true
    block_obs_tail_layer: false
    #
    # hard_block_nodes [bool]: 장애물이 가리는 노드를 Dijkstra 후보에서 아예 뺄지.
    #   false = 예전 방식. 나가는 edge 에 +1e6 벌점만 준다. 벌점이 유한해서 우회 경로의
    #     곡률 비용(w_curv_peak * (kmax-kmin)^2 * len)이 1e6 을 넘는 순간 "장애물을 뚫고 가는
    #     경로"가 최적해가 되고, runOnline 이 그걸 통째로 폐기해 빈 경로를 publish 했다.
    #     obs_debug_0820_1348 실측: otwpnts 3320개 중 2442개(73.6%)가 빈 메시지.
    #   true  = 후보 생성 단계에서 제외. 나온 경로는 항상 장애물을 안 밟고, 못 찾으면
    #     "graph_search(): No valid goal ... 자유 통로가 실제로 없다" 로 진짜 불가가 구분된다.
    #   되돌리려면: ros2 param set /graph_planner hard_block_nodes false
    hard_block_nodes: true
    #
    # ---- 속도 비례 safety_margin ----
    # obs_debug_0804_2103 실측: 나란히 지난 1019 프레임의 표면 여유 중앙이 +0.102 m,
    # 27.8% 가 음수(스침). 고속일수록 pose/추종 오차가 커지므로 여유를 키운다.
    #   cur_vs <= sm_v_lo -> safety_margin,  cur_vs >= sm_v_hi -> safety_margin_hi, 사이는 선형
    # safety_margin_hi <= safety_margin 이면 기능 비활성(현재 상태).
    # 튜닝: 0.20 -> 0.25 -> 0.30 순으로 올리며 RViz 회피선이 사라지는 지점 직전까지.
    #   상한 근거: 트랙 폭 ~1.2 m - 장애물 0.3 - 차 0.28 = 양쪽이 나눠 쓸 0.62 m.
    safety_margin_hi: 0.25   # [m] 고속에서 쓸 값
    sm_v_lo: 2.0             # [m/s] 이 속도 이하는 safety_margin 그대로 (저속 거동 보존)
    sm_v_hi: 5.0            # [m/s] 이 속도 이상은 safety_margin_hi 그대로
    #   실제 회피는 2~4 m/s 에서 주로 일어나므로 3.5 로 낮추는 것도 고려할 것    

    # ---- 회피 방향 잠금 (2026-08-21 신규) ----------------------------------
    # obs_debug_0821_1417(495초) 실측: 장애물 통과 67회 중 16회(24%)가 표면 여유
    # 0.14 m 미만 = 차 몸통이 닿는 거리로 지나갔다. 9회는 0.05 m 미만, 최악 -0.081 m.
    # 원인은 회피 방향이 마지막 순간까지 바뀌는 것이다:
    #   이 차의 실측 횡방향 이동 능력은 p90 0.63 m/s. 0.4 m 비키는 데 0.63초 걸리고
    #   그동안 3 m/s 면 1.9 m 를 전진한다. 즉 장애물이 2 m 안에 들어온 뒤의 방향 변경은
    #   실행이 불가능하고, 좌우 명령을 번갈아 받은 차는 어느 쪽으로도 못 가고
    #   가운데(=장애물)로 간다. 접촉한 통과 16회 중 9회가 마지막 2.5 m 안에
    #   경로 목표가 0.2 m 이상 바뀐 케이스였다.
    #
    # 잠그는 대상은 '경로'가 아니라 '어느 쪽으로 피할지' 하나다. 경로 기하는 매 주기
    # 새로 푼다(그래야 추종 오차/새 장애물에 대응한다). 대상 장애물의 layer 에서
    # 반대쪽 노드를 후보에서 제외하는 방식이라 hard_block_nodes 와 같은 하드 제외다.
    #
    # 끄려면: ros2 param set /graph_planner side_lock false  (전부 dynamic)
    side_lock: true
    # [m] 대상 장애물이 이 거리 안에 들어오면 방향 변경 금지.
    #   이 안에서 잠근 쪽 해가 없으면 방향을 바꾸는 게 아니라 빈 경로를 낸다
    #   -> state machine 이 TRAILING 으로 감속한다("방향 대신 속도를 줄인다").
    #   근거: v=2.5 m/s 에서 1.58 m, v=3.0 에서 1.90 m 가 필요하다.
    side_freeze_dist: 1.7
    # 동결 거리 '밖'에서 잠근 방향으로 이만큼 연속 실패해야 잠금을 푼다.
    #   1 로 두면 한 프레임 흔들림에도 방향이 바뀌어 잠금이 무의미해진다.
    #   퍼셉션 지터가 크다(같은 장애물의 d 표준편차 0.138 m, size 0.133 m).
    side_unlock_fails: 3
    # [m] '같은 장애물'인지 판정하는 s 허용오차. 이보다 크게 튀면 새 장애물로 보고
    #   잠금을 푼다(새 장애물은 새 정보라 동결 거리와 무관하게 다시 판단해야 한다).
    side_lock_match_dist: 1.0
