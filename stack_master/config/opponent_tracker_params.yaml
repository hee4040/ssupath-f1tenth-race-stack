# tracking 노드(perception/src/tracking) 파라미터.
#
# ★ 2026-08-04 발견: 최상위 키가 `perception:` 이었으나 노드 이름은 `tracking` 이다
#   (tracking_launch.xml 의 name="tracking", 네임스페이스 push 없음).
#   ROS2 는 최상위 키를 노드 이름과 매칭하므로 이 파일은 **통째로 무시되고 있었고**,
#   트래커는 전부 tracking.cpp 의 declare_parameter 기본값으로 돌아왔다.
#   일부러 끊어둔 게 아니라 upstream ForzaETH 잔재다 — 원래 stack 은 `perception`
#   이라는 노드 하나가 detect/tracking 를 하위 네임스페이스로 갖는 구조였는데,
#   이 저장소가 C++ 로 재작성하면서 노드를 쪼개고 yaml 은 안 고쳤다.
#   키는 `tracking:` 으로 바로잡았다.
#
# ★ 단, **지금은 아무 값도 활성화하지 않는다.** 이 파일이 죽어 있던 동안의
#   모든 튜닝이 cpp 기본값 기준으로 이뤄졌으므로, 값을 켜는 순간 그 전제가 깨진다.
#   2026-08-04 에 max_dist/dist_infront/dist_deletion 3개를 켰다가 원복했다 —
#   이유는 아래 "왜 원복했나" 참조.
#
# === 왜 원복했나 (obs_debug_0804_1612 실측) ===
#   퍼셉션의 진짜 상한은 여기가 아니라 passthrough_filter_node.param.yaml 의
#   크롭 박스(x[-4,4] y[-7,0] z[0.01,0.3]) 다. **전방 7 m 밖의 점군이 아예 없다.**
#   따라서 dist_infront 를 7 -> 12 로 올려도 통과시킬 장애물 자체가 존재하지 않고
#   (7 m 초과 검출 0.9%), 남는 건 트랙을 오래 살려두는 부작용뿐이었다.
#   max_dist 완화(0.5 -> 1.5)도 마찬가지로 이득 없이 오검출 병합 위험만 늘렸다.
#   실제로 이 3개를 켠 주행에서 "일반 주행이 굼떠졌다"는 보고가 나왔다.
#   -> 거리를 늘리려면 크롭 박스부터 키우고, 그다음 여기를 맞춰야 한다.
#
# === 값을 켤 때 반드시 확인할 것 (괄호 = tracking.cpp 기본값) ===
#   아래를 그대로 풀면 4개가 동시에 바뀐다. 하나씩 A/B 할 것.
#
#   P_vs: 0.0002              # (cpp 0.2)  1000배 차이!
#   measurment_var_vs: 0.002  # (cpp 0.2)  100배 차이
#   measurment_var_vd: 0.002  # (cpp 0.2)  100배 차이
#   var_pub: 3                # (cpp 1.0)
#
#   아래는 cpp 기본값과 같아서 켜도 효과 없음:
#   rate: 40 / P_d: 0.02 / P_vd: 0.2 / measurment_var_s: 0.002
#   measurment_var_d: 0.002 / process_var_vs: 2 / process_var_vd: 8
#   max_dist: 0.5
#
#   거리 관련 (크롭 박스를 키운 뒤에 같이 올릴 것):
#   dist_infront: 7.0   # (cpp 7.0) 이 거리보다 먼 앞쪽 장애물은 추적/발행 안 함
#   dist_deletion: 6.0  # (cpp 6.0) 정적 트랙 유지 거리

tracking:
  ros__parameters:
    # ======================= 정적 장애물 래치 =======================
    # ★ 2026-08-19 추가. 위의 "아무 값도 활성화하지 않는다" 원칙에서 이 블록만 예외다 —
    #   이 키들은 이번에 새로 만든 것이라 cpp 기본값이 곧 '기존 거동'이고,
    #   따라서 켜는 것 말고는 과거 튜닝의 전제를 건드리지 않는다.
    #
    # === 왜 필요했나 (obs_debug_0819_1608 실측) ===
    #   증상: 장애물을 보고 급정지했다가 0.5 초 뒤 재가속해 같은 장애물을 밟고 지나감.
    #   원인 사슬 —
    #     t=137.16  검출 -> 트랙 생성
    #     t=137.24  TRAILING, 속도명령 1.84 -> 0.00
    #     t=137.69  ★ 추적 장애물 소멸 (검출이 끊긴 지 0.5 초)
    #     t=137.74  GB_TRACK, 속도명령 0.77 -> 2.58
    #     t=138.89  같은 자리에서 재검출, gap -0.17 (이미 밟고 지나감)
    #   숫자로 —
    #     트랙 수명 중앙값 0.50 s  = sd_ttl(20) / rate(40).  245 초에 트랙 108 개 생성.
    #     검출 끊김 중앙 1.03 s / p90 4.90 s -> 끊김이 0.5 s 를 넘는 비율 60.4%.
    #   즉 장애물이 없어져서 출발한 게 아니라 **타이머가 끝나서** 출발한 것이다.
    #   sd_ttl 을 올리는 건 충돌을 늦출 뿐이다(2 초 뒤에 똑같이 박는다).
    #
    # === 무엇이 바뀌나 ===
    #   정적 트랙의 해제 조건이 '시간'에서 '사건'으로 바뀐다:
    #     기존: 재검출이 sd_ttl/rate 초간 없으면 삭제
    #     래치: (A) 차가 그 지점을 지나가거나, (B) 시야가 뚫렸는데 latch_max_hold 초간
    #           재검출이 없으면(=오검출) 삭제. 그 전에는 유지.
    #   래치가 걸린 트랙은 ttl 을 아예 안 깎는다.
    #
    # === 대가 (정직하게) ===
    #   백 재생 시뮬레이션(1608, 차가 막혀 있는 시간 비율):
    #     현행                     18.9%
    #     래치만                   30.9%
    #     래치 + 2회 확인          23.9%   <- 채택
    #     래치 + 3회 확인          21.4%
    #   막힘 '사건 수'는 42 -> 24 회로 줄고 한 번 막히면 길어진다. 의도한 거동이다.
    #   ※ 시뮬레이션은 녹화된 차가 실제로 장애물을 밟고 지나갔기 때문에 래치가 항상
    #     '지나감'으로 풀렸다. 실차에서는 서서 안 지나가므로 **"박고 지나감"이
    #     "그 자리에 계속 정지"로 바뀐다.** 안전하지만 랩은 거기서 끝난다.
    #     1608 의 정지 26 회 전부 otwpnts=0 (회피 경로 없음) 이었으므로 이건 트랙 폭
    #     문제가 드러나는 것이지 래치의 결함이 아니다.
    #
    # === 전제조건 ===
    #   유령 비율이 낮아야 한다. 래치는 오검출도 같이 오래 붙잡기 때문이다.
    #     obs_debug_0819_1209 (min_intrusion 0.18): 검출의 32.3% 가 트랙 밖 유령 -> 위험
    #     obs_debug_0819_1608 (min_intrusion 0.33): 4.5% -> 실용 범위
    #   min_intrusion 을 다시 낮출 거면 이 값도 같이 재검토할 것.
    #
    # false 로 두면 기존 거동 그대로다(cpp 기본값도 false).
    latch_static_until_passed: true

    # 래치를 걸기 전 필요한 측정 횟수. 단발로 튄 검출을 영구화하지 않기 위한 확인 단계.
    # staticFlag 자체가 sd_min_nb_meas(2) 초과에서만 정해지므로 실효 하한은 3 이다.
    # 1 로 내리면 확인 없이 래치된다 — 권장하지 않는다(위 표에서 30.9%).
    latch_min_hits: 2

    # 차가 이만큼 지나쳤으면 해제 [m]. 대칭 래핑 기준이라 '뒤'와 '한 바퀴 앞'을 구분한다.
    latch_release_behind: 0.5

    # 오검출 해제까지 버티는 시간 [s].
    # 시야가 뚫려 있는데(inFOV) 이만큼 재검출이 없으면 유령으로 보고 놓아준다.
    # 1608 기준 검출 끊김은 중앙 1.03 s / p90 4.90 s.
    # 3.0 은 p90 아래라 긴 끊김(상위 10%)에서는 진짜 장애물도 놓아준다 —
    # 치웠을 때 빨리 출발하는 것을 우선한 값이다(2026-08-19, 실차 체감 기준).
    # 0 이하로 두면 이 해제를 끈다(지나가기 전엔 절대 안 지워짐 — 실차에서 권장 안 함).
    latch_max_hold: 3.0

    # ★ 교착 방지 하드 캡 [s]. 가시성 판정(inFOV)과 **무관하게** 이만큼 재검출이 없으면 해제.
    #
    # 왜 생겼나 — 2026-08-19 실차: 래치를 켠 첫 주행에서 장애물을 치웠는데도 차가
    #   영원히 정지했다. 원인은 latch_max_hold 가 의존하는 inFOV 가 **엉뚱한 라이다 빔을
    #   읽고 있었기 때문**이다. /scan 은 livox_frame 인데 방위각은 base_link 기준으로
    #   계산돼서 90도 어긋나 있었다(옆 벽을 보고 "안 비었다"고 판정).
    #   obs_debug_0819_1608, 정면 2.5 m 이내 896건 실측:
    #     보정 전 조회 빔 min_scan 중앙 0.88 m  <- 옆 벽
    #     보정 후 조회 빔 min_scan 중앙 1.71 m  <- 실제 장애물 거리 1.72 m 와 일치
    #   프레임 버그는 tracking.cpp 에서 TF 로 고쳤지만(scanCB/resolveScanYaw),
    #   가시성 판정 하나에 정지 해제를 통째로 걸어두는 구조 자체가 위험하다.
    #   이 값은 그 안전망이므로 항상 켜 둘 것. 0 이하면 끔(권장 안 함).
    #
    # 단, 이건 양날이다 — 장애물이 진짜로 있는데 검출이 계속 실패하면(벽 병합 문제)
    # 이 시간 뒤에 놓아주고 다시 출발한다. 즉 충돌 시점을 0.5 s 에서 이 값으로 미룰 뿐이다.
    # 근본 해결은 검출 연속성(선필터)이지 이 값이 아니다.
    #
    # ※ 반드시 latch_hard_release >= latch_max_hold 를 지킬 것. 반대로 두면 하드 캡이
    #   항상 먼저 터져서 latch_max_hold 가 죽은 값이 되고, 가시성 확인이 무의미해진다.
    latch_hard_release: 7.0
