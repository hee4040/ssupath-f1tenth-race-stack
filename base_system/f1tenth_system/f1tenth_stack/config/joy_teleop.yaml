joy:
  ros__parameters:
    # device_name: /dev/input/joypad-f710
    device_id: 0
    deadzone: 0.01
    autorepeat_rate: 20.0
    coalesce_interval: 0.01

joy_teleop:
  ros__parameters:
    # default:
    #   type: topic
    #   interface_type: ackermann_msgs/msg/AckermannDriveStamped
    #   topic_name: teleop
    #   axis_mappings:
    #     drive-speed:
    #       axis: 1
    #       scale: 0.0
    #       offset: 0.0
    #     drive-steering_angle:
    #       axis: 2
    #       scale: 0.0
    #       offset: 0.0

    human_control:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      # topic_name: teleop
      topic_name: drive
      # Xbox controller:
      #   deadman_buttons: [4]  # LB
      deadman_buttons: [4]    # Sony Wireless Controller: L1
      axis_mappings:
        drive-speed:
          axis: 1    # Sony: left stick vertical
          scale: 1.0    # default = 5.0 -> too fast
          offset: 0.0
        drive-steering_angle:
          # Xbox controller:
          # axis: 3    # right stick horizontal
          axis: 2    # Sony Wireless Controller: right stick horizontal
          scale: 0.36
          offset: 0.0

