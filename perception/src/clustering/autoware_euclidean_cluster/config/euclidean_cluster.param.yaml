/**:
  ros__parameters:
    # 클러스터 바운딩박스 상한 [m]. 한 축이라도 넘으면 그 클러스터는 통째로 버려진다
    # (euclidean_cluster_node.cpp:94). 즉 값을 '늘리면' 더 많이 보고, 줄이면 큰 구조물을
    # 걸러낸다. 축은 라이다 프레임 기준이고 base_link->livox_frame 은 z축 +90도 회전이라
    #   max_x = 가로(횡) / max_y = 앞뒤(종) / max_z = 높이  에 해당한다.
    #
    # ★ 2026-08-04: 0.6 -> 0.8 (세 축 모두). 원래값은 아래 주석 참조.
    #   근거 — 대회 규격상 장애물은 0.5 x 0.5 m 이하인데, 비스듬히 보면 축정렬
    #   바운딩박스가 커진다: 0도 0.500 / 15도 0.612 / 30도 0.683 / 45도 0.707 m.
    #   따라서 0.6 은 **약 15도 이상 틀어진 장애물을 버린다.** 트랙을 돌면 장애물을
    #   정면으로만 보는 일이 거의 없으므로 실제로 물린다. 0.8 이면 45도(0.707)까지
    #   여유 0.09 m 로 커버하면서, 벽처럼 훨씬 큰 덩어리는 계속 걸러낸다.
    #   오프라인 A/B (obs_debug_0804_2103, 55초 재생, 클러스터 연속성):
    #     0.6/0.6/0.6 : 총 2.88/프레임, 5~6m 39.9%, 6~7m 24.1%
    #     0.8/0.8/0.8 : 총 3.17/프레임, 5~6m 44.2%, 6~7m 28.3%   <- 채택
    #     1.0/1.0/0.9 : 총 3.33/프레임, 5~6m 44.8%, 6~7m 28.8%   (이득 미미, 유령 위험만 증가)
    #   축별 기여도: max_x 단독 상향은 효과 0 이었다(2.88 -> 2.88). 실제로 문턱에
    #   먼저 닿는 축은 높이(dz 가 최대인 클러스터 67.9%)와 앞뒤(21.7%)였다.
    # 원래값: max_x: 0.6 / max_y: 0.6 / max_z: 0.6
    max_x: 0.8
    max_y: 0.8
    max_z: 0.8
    max_cluster_size: 750 #750 f1tenth

    # 클러스터로 인정할 최소 점 개수.
    # 2026-08-04: 4 -> 3. 원거리 장애물이 깜빡이는 문제 대응.
    #   obs_debug_0804_1657 실측 — 물체당 점 개수 중앙값이 3~4m 에서 9개인데
    #   6~7m 에서는 5~6개로 문턱(4) 바로 위라, 프레임마다 4->3->5 로 널뛰며
    #   3개인 순간 물체가 통째로 사라진다. 그래서 6~7m 구간 연속성이 23.1% 뿐이고
    #   5.4 m/s 로 달리면 그 구간 체류시간이 0.185s(=1.7프레임)라 사실상 못 본다.
    # 오프라인 A/B(같은 백 55초 재생) 결과:
    #   min_cluster_size 4 -> 3 : 6~7m 연속성 23.1% -> 28.2% (+22%),
    #                             총 클러스터 2.62 -> 3.08 /프레임 (+18% = 유령 위험)
    # ★ tolerance 는 올리지 말 것. 0.2 -> 0.3 은 역효과였다(연속성 23.1% -> 13.3%).
    #   반경을 키우면 원거리 물체가 주변 벽/바닥 점과 한 덩어리로 흡수돼 버린다
    #   (근거리 클러스터 점 중앙값이 53 -> 71 로 커진 것이 증거). 07-24 백업본의
    #   3/0.3 조합도 현재보다 나빴다.
    min_cluster_size: 3    # 이전값 4 (그 이전 3)
    tolerance: 0.2          #0.4
    use_height: false
