/**:
  ros__parameters:
    # 트랙 경계를 이만큼 '안쪽으로' 줄인다 (d_left - infl, d_right - infl).
    # 벽 자체를 장애물로 잡지 않으려는 안전장치인데, 그만큼 벽쪽 장애물도 같이 버린다.
    # ★ 2026-08-04: 0.07 -> 0.03. "벽에 붙은 장애물이 인식이 안 된다" 대응.
    #   obs_debug_0804_2015 실측 — 트랙 반폭이 좌 0.710 / 우 0.509 m 인데
    #   0.07 을 깎으면 폭의 10~14% 가 날아간다. 탐지 장애물의 횡위치 분포를 보면
    #   경계 대비 0.85~0.90 에 20개, 0.90~0.95 에 11개, 0.95~1.00 에 1개로
    #   문턱 직전에서 급격히 끊긴다(전체의 11.5% 가 문턱까지 5cm 이내).
    #   즉 벽에 붙은 상자는 중심이 이 버려지는 띠 안에 들어가 통째로 무시된다.
    #   0.03 이면 좌 0.680 / 우 0.479 까지 인정 -> 벽에서 3cm 밖이면 잡힌다.
    # 부작용: 너무 줄이면 벽 점군 자체가 장애물로 잡혀 유령이 생긴다.
    #   유령이 늘면 0.05 로 되돌리고, 그래도 벽쪽을 못 잡으면 0.0 까지 내려볼 것.
    # 변경 후 노드 재시작 필요(파라미터 콜백 없음).
    boundaries_inflation: 0.06

    # 전방 장애물 탐지 거리 [m]. cpp 기본값 5.0.
    # laserPointOnTrack 에서 wrap_s(obs_s - car_s) > 이 값 이면 버린다.
    #
    # 이력: 2026-08-04 오후에 10.0 으로 올렸다가 원복했다. 당시 근거는
    #   "크롭 박스(x[-4,4] y[-7,0]) 때문에 7 m 밖엔 점군이 없으니 무의미하다" 였다.
    #   그 사실 자체는 맞지만, 이 값이 왜 중요한지를 잘못 봤다.
    #
    # ★ 2026-08-04 저녁 재상향(5.0 -> 10.0). 새 근거 — obs_debug_0804_2015:
    #   cluster_to_obstacle 의 검출률이 속도에 따라 붕괴한다.
    #     1~2 m/s 30.6% / 2~3 9.5% / 3~4 8.5% / 4~5 3.3% / 5+ 3.7%  (8배)
    #   그런데 바로 앞단인 /clusters 는 멀쩡하다(클러스터/프레임 2.5~2.9 로 평탄,
    #   최대변 중앙 0.18~0.29 m 로 속도 무관 -> sweep 번짐 가설은 기각됨).
    #   즉 드롭이 이 노드 안에서 일어난다.
    #   원인 추정: TF 변환이 라이다 타임스탬프로 실패하면 "가장 최신 TF"로 폴백하는데
    #   (아래 clusterCb 의 (B) 경로), NDT 가 약 0.2 s 뒤처져 있어 폴백 시
    #   위치 오차 = 속도 x 0.2 s 가 된다(6.6 m/s 면 1.3 m).
    #   그 오차가 위 거리 검사를 넘겨 정상 장애물을 버린다.
    #   t=187 사고: 4초간 무탐지로 2.4->6.6 m/s 가속 후, 첫 탐지가 gap +0.01 m
    #   (이미 차 옆). 경고 시간 0초 -> 상태머신은 GB_TRACK 유지가 정당했다.
    # 10.0 은 그 지연 오차에 대한 여유다. 근본 수정은 lidarslam 의 use_odom:true.
    # 부작용: 트레일링이 더 일찍 걸려 주행이 다소 굼떠질 수 있다.
    max_viewing_distance: 10.0   #여기는 소용없을듯..? 7m로 다른 데서 자르고 있음

    # ★ 2026-08-05: laserPointOnTrack 이 중심점 대신 장애물의 가로 끝
    #   [d - size/2, d + size/2] 로 판정하도록 바꿨다. 벽에 붙은 장애물은 중심이
    #   경계 밖이라 통째로 버려지던 문제 대응(위 boundaries_inflation 축소와 같은
    #   목적이지만, 트랙 폭 전체를 넓히는 대신 장애물 폭만큼만 넓히므로 더 정확하다).
    #
    # 이 값은 장애물이 트랙 안쪽을 최소 몇 m 물고 있어야 인정할지다.
    #   0.0  = 끝이 경계에 스치기만 해도 통과 (가장 잘 잡힘, 유령도 가장 많음)
    #   0.05~0.10 = 경계 바깥에 아슬아슬하게 걸치는 벽 점군을 다시 걸러낸다
    # 부작용: 0.0 이면 트랙 밖 최대 size/2 (클러스터 상한 0.6 -> 0.3 m) 까지의
    #   벽 조각/기둥이 장애물로 올라와 없는 장애물에 제동이 걸릴 수 있다.
    #   rviz 에서 /perception/detection/obstacles_markers 에 벽을 따라 큐브가
    #   줄줄이 뜨면 이 값을 올릴 것. 변경 후 노드 재시작 필요(파라미터 콜백 없음).
    #
    # ★ 2026-08-06: 0.0 -> 0.15. 예상대로 벽이 장애물로 잡혔다.
    #   obs_debug_0806_1157(150초, 8랩) 을 lobby_0806 지도와 대조한 실측:
    #     검출 813개 중 벽 유령 464개(57%), 전체 프레임의 70.2% 에 유령이 하나 이상.
    #   유령의 binding(경계 침범깊이) 중앙 0.074 / p90 0.196 인 반면
    #   진짜 상자는 p10 0.318 이라 이 축으로 잘 갈린다.
    #   euclidean_cluster 의 max_x/max_y 0.7 과 병행 시 (그쪽 주석 참조):
    #     유령프레임 70.2% -> 6.1%, 진짜 상자 98% 유지.
    #
    # ★ 이 값을 더 올릴 때의 한계선 — 벽에 '밀착'한 진짜 상자의 binding 은
    #     binding ≈ size - 0.12   (0.12 = 트랙 경계와 실제 벽 사이 여유 중앙값,
    #                              lobby_0806 지도에서 실측: 좌 0.122 / 우 0.116)
    #   즉 min_intrusion=0.15 는 size 0.27 m 미만 상자가 벽에 붙으면 다시 놓친다.
    #   0.20 이면 0.32, 0.25 면 0.37 미만을 놓친다. 0.19 근처부터는 중앙 크기
    #   장애물 기준으로 08-05 수정 이전(중심점 판정)과 사실상 같아지므로,
    #   여기를 0.2 이상으로 올릴 바에는 크기 상한을 조이는 편이 낫다.
    #
    # 주의: boundaries_inflation 을 δ 늘리는 것과 min_intrusion 을 δ 늘리는 것은
    #   이 필터에 한해 수학적으로 동일하다(binding = d_left - infl - d + size/2).
    #   둘을 같이 올리면 이중으로 적용되니 한쪽만 건드릴 것.
    min_intrusion: 0.15
