/**:
  ros__parameters:
    # ★ 2026-08-11: 트랙 경계를 '원본 맵' 기준으로 받는다.
    #   지금까지는 /global_waypoints 의 d_left/d_right 를 썼는데, 그 값은 편집 맵
    #   (<map>.png) 에서 뽑은 것이다. 편집 맵은 레이스라인이 구석으로 새지 않도록
    #   알코브를 까맣게 메워 놓기 때문에 그 구간 경계가 실제 벽보다 안쪽이고,
    #   결과적으로 거기 놓인 진짜 장애물이 "트랙 밖"으로 통째로 버려졌다.
    #   lobby_0811 실측: 편집으로 830 셀(약 2.1 m^2)이 메워졌다.
    #   /global_waypoints/original_bounds 는 x/y/psi/s 는 그대로 두고
    #   d_left/d_right 만 원본 맵(<map>_origin.png) 의 실제 벽 위치로 보정한 것이라
    #   프레네 좌표계와 하류 s/d 는 전혀 바뀌지 않는다.
    #   발행: global_trajectory_publisher, 계산: global_planner/origin_map_bounds.py
    #   원본 png 가 없는 맵은 자동으로 편집 맵 경계 그대로 발행된다(동작 무변화).
    frenet_waypoints_topic: "/global_waypoints/original_bounds"

    # 위 토픽이 안 뜰 때만 쓰는 대비책. 원본 경계를 한 번이라도 받으면 무시된다.
    # 비워두면 폴백 없음. (없으면 경계 미수신 -> 클러스터 전량 폐기 -> 탐지 정지)
    fallback_waypoints_topic: "/global_waypoints"

    # 폴백을 받아들이기 전 원본 경계를 기다리는 시간 [s].
    # global_trajectory_publisher 의 발행 주기(5 s)보다 넉넉해야 한다.
    fallback_grace_period: 8.0

    # ★ 2026-08-12: boundaries_inflation 은 삭제됐다. min_intrusion 하나로 합쳤다.
    #   (예전 boundaries_inflation 0.07 + min_intrusion 0.30 = 지금의 min_intrusion 0.37)
    #   둘은 이 필터 안에서 수학적으로 완전히 동일한 항이었다. 옛 주석/기록에서
    #   "infl 0.07" 이 나오면 지금은 min_intrusion 에 흡수됐다고 읽으면 된다.

    # 전방 장애물 탐지 거리 [m]. cpp 기본값 5.0.
    # laserPointOnTrack 에서 wrap_s(obs_s - car_s) > 이 값 이면 버린다.
    #
    # 이력: 2026-08-04 오후에 10.0 으로 올렸다가 원복했다. 당시 근거는
    #   "크롭 박스(x[-4,4] y[-7,0]) 때문에 7 m 밖엔 점군이 없으니 무의미하다" 였다.
    #   그 사실 자체는 맞지만, 이 값이 왜 중요한지를 잘못 봤다.
    #
    # ★ 2026-08-04 저녁 재상향(5.0 -> 10.0). 새 근거 — obs_debug_0804_2015:
    #   cluster_to_obstacle 의 검출률이 속도에 따라 붕괴한다.
    #     1~2 m/s 30.6% / 2~3 9.5% / 3~4 8.5% / 4~5 3.3% / 5+ 3.7%  (8배)
    #   그런데 바로 앞단인 /clusters 는 멀쩡하다(클러스터/프레임 2.5~2.9 로 평탄,
    #   최대변 중앙 0.18~0.29 m 로 속도 무관 -> sweep 번짐 가설은 기각됨).
    #   즉 드롭이 이 노드 안에서 일어난다.
    #   원인 추정: TF 변환이 라이다 타임스탬프로 실패하면 "가장 최신 TF"로 폴백하는데
    #   (아래 clusterCb 의 (B) 경로), NDT 가 약 0.2 s 뒤처져 있어 폴백 시
    #   위치 오차 = 속도 x 0.2 s 가 된다(6.6 m/s 면 1.3 m).
    #   그 오차가 위 거리 검사를 넘겨 정상 장애물을 버린다.
    #   t=187 사고: 4초간 무탐지로 2.4->6.6 m/s 가속 후, 첫 탐지가 gap +0.01 m
    #   (이미 차 옆). 경고 시간 0초 -> 상태머신은 GB_TRACK 유지가 정당했다.
    # 10.0 은 그 지연 오차에 대한 여유다. 근본 수정은 lidarslam 의 use_odom:true.
    # 부작용: 트레일링이 더 일찍 걸려 주행이 다소 굼떠질 수 있다.
    max_viewing_distance: 10.0   #여기는 소용없을듯..? 7m로 다른 데서 자르고 있음

    # ============================ 유일한 탐지 문턱 ============================
    # 장애물의 '안쪽 끝'이 트랙 경계(d_left/d_right)보다 이만큼 안으로 들어와야
    # 장애물로 인정한다.  판정식 (laserPointOnTrack):
    #     통과 조건:  d - size/2  <  d_left  - min_intrusion     (좌측)
    #                 d + size/2  > -d_right + min_intrusion     (우측)
    # 중심 기준으로 다시 쓰면 "빨간 점(문턱선)보다 (min_intrusion - size/2) 만큼
    # 더 안쪽에 중심이 있어야 한다".  크기가 클수록 문턱이 낮아진다:
    #     size 0.20 -> 안쪽 0.27 m      size 0.50 -> 안쪽 0.12 m
    #     size 0.30 -> 안쪽 0.22 m      size 0.74 이상 -> 문턱선 위에서도 통과
    #
    # ★ rviz 의 /perception/detect_bound (빨간 점) 가 정확히 이 문턱선이다.
    #   2026-08-12 이전에는 마커가 boundaries_inflation 만 반영해서, 보이는 선과
    #   실제 판정선이 0.30 m 어긋나 있었다. 지금은 같다 — 보이는 것 = 판정하는 것.
    #
    # 변경 후 노드 재시작 필요(파라미터 콜백 없음).
    #
    # ---------------------------------------------------------------------
    # 값을 정하는 두 부등식 (경계가 '진짜 벽'인 original_bounds 를 쓸 때만 성립)
    # ---------------------------------------------------------------------
    #   (1) 벽 클러스터를 한 개도 안 들이려면
    #         2 * min_intrusion  >  클러스터 가로 상한(euclidean_cluster 의 max_x/max_y)
    #         2 * 0.37 = 0.74  >  0.7      <- 성립 (여유 0.04)
    #       벽면에 중심이 얹힌 폭 w 클러스터의 침범깊이가 w/2 라서 나오는 식이다.
    #   (2) 벽에 '밀착'한 진짜 상자는 침범깊이가 w 이므로
    #         w > min_intrusion = 0.37 m  이면 여전히 잡힌다.
    #       대회 규격 0.5 x 0.5 상자는 어느 각도로 봐도 0.5 이상이라 안전하다.
    #   -> 즉 쓸 수 있는 범위는 (클러스터상한/2, 상자크기) = (0.35, 0.50). 0.37 은 그 하단.
    #
    #   ※ euclidean_cluster 의 max_x/max_y 를 0.7 위로 올리면 (1) 이 깨지므로 여기도
    #     같이 올려야 한다 (cap 0.8 이면 min_intrusion 0.40 이상).
    #     반대로 cap 을 내려 유령을 잡으려는 시도는 기각됐다 — 규격 상자 방위의
    #     71% 를 잃고 유령은 0.4%p 밖에 못 준다(그쪽 주석 참조).
    #   ※ frenet_waypoints_topic 을 /global_waypoints(편집 맵)로 되돌릴 거면 전제가
    #     깨지므로 이 값도 0.22 로 같이 되돌릴 것.
    #
    # ---------------------------------------------------------------------
    # ---------------------------------------------------------------------
    # ★ 2026-08-12 저녁: 0.37 -> 0.42. 경계 계산이 바뀐 데 대한 상쇄다.
    # ---------------------------------------------------------------------
    #   origin_map_bounds 가 '편집맵 값 + 레이캐스팅 차이' 대신 **원본 맵 벽까지의
    #   최단거리 절대값**을 쓰도록 바뀌었다(그쪽 docstring 참조). 경계가 진짜 벽까지
    #   나가면서 lobby_0812 기준 좌 +4.6 cm / 우 +14.9 cm 넓어졌고,
    #   경계를 δ 넓히는 건 min_intrusion 을 δ 내리는 것과 같으므로 문턱도 올려야 한다.
    #
    #   obs_debug_0812_1407 오프라인 A/B (진짜=벽에서 45cm 초과, 유령=벽 20cm 이내):
    #     구 경계 + 0.37 : 통과 298, 진짜 196, 유령 14
    #     신 경계 + 0.37 : 통과 334, 진짜 197, 유령 24   <- 유령이 거의 2배
    #     신 경계 + 0.42 : 통과 301, 진짜 196, 유령 15   <- 채택 (구 경계와 동등)
    #     신 경계 + 0.50 : 통과 266, 진짜 190, 유령 13
    #   평균 탐지 성능은 구 경계와 사실상 같다. 바뀐 것은 **일관성**이다 —
    #   50 cm 상자가 벽에서 떨어져야 하는 거리가 지점에 따라 16~39 cm 로 흔들리던 것이
    #   전 구간 정확히 17 cm 가 됐다(p90-중앙 편차 1.5 -> 0.0 cm).
    #   덕분에 "벽에서 (min_intrusion - size/2)" 라는 규칙이 어디서나 그대로 맞는다.
    #   ※ 부등식 (1) 도 더 여유로워졌다: 2*0.42 = 0.84 > 0.7.
    #
    # 실측 A/B — obs_debug_0811_1503 (186초, 장애물 0개라 검출 269개 전부가 유령)
    #   ※ 아래 수치는 '구 경계' 기준이다. 값이 0.37 -> 0.42 로 올랐어도 경계가 같이
    #     넓어졌으므로 실효 문턱은 거의 같다. 상대 비교용으로만 볼 것.
    # ---------------------------------------------------------------------
    #     0.22 : 264개 잔존, 유령프레임 11.5%   (벽 클러스터가 그대로 통과. (1) 위반)
    #     0.37 : 131개 (-50%), 유령프레임 6.0%  <- 채택
    #     0.42 : 104개 (-61%), 유령프레임 4.9%  단 밀착 상자 하한 0.42
    #     0.47 :  90개 (-66%)                   단 밀착 상자 하한 0.47
    #   진짜 장애물 쪽 손실은 거의 없다 — obs_debug_0811_1726 에서 벽으로부터 0.45 m
    #   이상 떨어진 검출(=진짜) 220개 중 219개 유지, 벽 유령만 447 -> 62개(-86%).
    #   유령이 더 줄어야 하면 0.42 로 올리는 게 클러스터 상한을 내리는 것보다 낫다.
    #
    # ---------------------------------------------------------------------
    # 실용 지침 — lobby_0812 기준, 50 cm 상자가 벽에서 떨어져야 하는 거리
    # ---------------------------------------------------------------------
    #     중앙 15.5 cm / p90 좌 28 · 우 55 cm.  여유를 봐서 30 cm 이상 떨어뜨릴 것.
    #     (p90 이 나쁜 이유는 origin_map_bounds 의 delta 가 계단처럼 튀기 때문.
    #      델타 스무딩을 넣으면 개선된다 — 미적용.)
    #
    # 이력: 0.0(08-05) -> 0.15(08-06, 벽 유령 대응) -> 0.30(08-11, original_bounds
    #   도입으로 경계가 넓어진 역풍 대응) -> 0.37(08-12, boundaries_inflation 0.07 을
    #   흡수. 마커 위치가 실제 문턱과 일치하게 됐다).
    #
    #   ※ 08-12 병합의 유일한 동작 차이: laserPointOnTrack 의 "트랙 최협부 안쪽이면
    #     무조건 통과" 예외가 0.07 m 넓어졌다(예전엔 그 예외도 infl 을 뺀 값 기준).
    #     백 재생 A/B 로 확인한 차이는 |d| <= 0.17 인 클러스터 6~11개뿐이고, 전부
    #     레이싱라인 정중앙이라 '더 잡는' 방향이다(1503 유령 193 -> 199, +6).
    #     비트 단위로 맞추려면 0.07 을 코드에 다시 숨겨야 해서 합친 의미가 없어진다.
    min_intrusion: 0.40
